<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Klinik Nissa – Teh Ais Manis</title>
<style>
@font-face{font-family:M;src:url(fonts/Montserrat-600.ttf);font-weight:600}
@font-face{font-family:M;src:url(fonts/Montserrat-800.ttf);font-weight:800}
@font-face{font-family:M;src:url(fonts/Montserrat-900.ttf);font-weight:900}
:root{--navy:#1b1450;--pink:#F0468A;--yellow:#FFC93C;--teal:#2ED3B7;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#24135f;font-family:M,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.a{position:absolute;will-change:transform,opacity}
.bg{left:0;top:0;width:1080px;height:1920px}
#bg0{background:linear-gradient(180deg,#22125c 0%,#35228c 45%,#5a2c93 78%,#8a3391 100%)}
#bgBody{background:linear-gradient(180deg,#3a0f3f 0%,#7a1740 45%,#a3243f 100%);opacity:0}
#bgAlert{background:linear-gradient(180deg,#2a0f4d 0%,#5a1a66 50%,#b02a68 100%);opacity:0}
.blob{border-radius:50%;filter:blur(40px)}
.star{border-radius:50%;background:#fff}
.sc{left:0;top:0;width:1080px;height:1920px;opacity:0}
.cam{left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
svg{display:block;overflow:visible}
/* caption */
#cap{left:60px;top:150px;width:960px;height:190px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:900;font-size:68px;line-height:1.12;text-shadow:0 5px 16px rgba(10,5,40,.6)}
#cap span{opacity:.35}
#cap span.on{opacity:1}
#cap span.k.on{color:var(--yellow)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:16px;height:84px;padding:0 30px 0 16px;border-radius:22px;background:var(--navy);
  font-weight:800;font-size:40px;white-space:nowrap;box-shadow:0 10px 26px rgba(10,5,40,.45);border:3px solid rgba(255,255,255,.12)}
.chip i{width:56px;height:56px;border-radius:16px;background:#2c2378;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:34px}
.chip.pink{background:var(--pink);border-color:rgba(255,255,255,.25)}.chip.pink i{background:rgba(255,255,255,.22)}
.chip.teal{background:var(--teal);color:#0f2a3a;border-color:rgba(255,255,255,.3)}.chip.teal i{background:rgba(255,255,255,.4)}
.chip.yel{background:var(--yellow);color:var(--navy);border-color:rgba(255,255,255,.3);font-weight:900}.chip.yel i{background:rgba(27,20,80,.15)}
.chip.np{padding-left:30px}
.tag{left:36px;top:1690px;font-weight:800;font-size:30px;color:#d9ccff;background:rgba(20,12,60,.55);padding:8px 16px;border-radius:12px}
/* title */
#title{left:90px;top:372px;width:900px;text-align:center}
#title .box{background:var(--navy);border-radius:36px;padding:26px 30px 34px;box-shadow:0 14px 40px rgba(10,5,40,.5);border:3px solid rgba(255,255,255,.12)}
#title .s{font-weight:800;font-size:40px;color:#b9a8ff;letter-spacing:2px}
#title .b{font-weight:900;font-size:96px;line-height:1.0;color:var(--yellow);margin-top:6px}
#title .p{display:inline-block;margin-top:-22px;background:var(--pink);font-weight:800;font-size:38px;padding:12px 28px;border-radius:18px;box-shadow:0 8px 20px rgba(10,5,40,.4)}
.big{font-weight:900;text-align:center;line-height:1}
.card{background:var(--navy);border-radius:36px;box-shadow:0 14px 40px rgba(10,5,40,.5);border:3px solid rgba(255,255,255,.12)}
.lbl{font-weight:800;font-size:36px;text-align:center}
</style>
</head>
<body>
<div id="stage">
  <div id="bg0" class="a bg"></div><div id="bgBody" class="a bg"></div><div id="bgAlert" class="a bg"></div>
  <div id="amb" class="a bg"></div>
  <div id="scenes" class="a bg"></div>
  <div id="tag" class="a tag">Kisah ilustrasi</div>
  <div id="cap" class="a"></div>
</div>
<script src="subs.js"></script>
<script>
/* ---------- helpers (everything is a pure function of t) ---------- */
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3), ei=x=>x*x*x, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,q)=>a+(b-a)*q;
const sin=Math.sin, PI=Math.PI;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function T(el,o){if(typeof el==='string')el=$(el);const s=o.s??1;
  el.style.transform=`translate(${(o.x||0).toFixed(2)}px,${(o.y||0).toFixed(2)}px) rotate(${(o.r||0).toFixed(2)}deg) scale(${(o.sx??s).toFixed(4)},${(o.sy??s).toFixed(4)})`;
  if(o.o!==undefined)el.style.opacity=cl(o.o).toFixed(3);}
const pop=(el,t,at,d=.42,extra={})=>{const q=P(t,at,d);T(el,{s:q<=0?0.001:back(q),o:P(t,at,.12),...extra})};
const popOut=(el,t,at,out,d=.42,extra={})=>{const q=P(t,at,d);const k=1-P(t,out-.2,.2);T(el,{s:q<=0?0.001:back(q)*(0.8+0.2*k),o:P(t,at,.12)*k,...extra})};
function mk(parent,id,x,y,w,h,html,origin){const d=document.createElement('div');d.className='a';if(id)d.id=id;
  d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform-origin:${origin||'50% 50%'}`;d.innerHTML=html||'';
  (typeof parent==='string'?$(parent):parent).appendChild(d);return d;}
const svg=(w,h,inner)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
function chip(parent,id,x,y,text,cls='',icon=''){const d=mk(parent,id,x,y,0,0,'', '0 50%');d.style.width='auto';d.style.height='auto';
  d.innerHTML=`<div class="chip ${cls} ${icon?'':'np'}">${icon?`<i>${icon}</i>`:''}${text}</div>`;return d;}

/* ---------- art ---------- */
const SKIN='#C98B5F', SKIN_D='#B5774C';
const glassSVG=(w=120,h=190)=>svg(w,h,`
  <rect x="${w*.60}" y="-46" width="9" height="${h*.9}" rx="4" fill="#F0468A" transform="rotate(12 ${w*.6} 0)"/>
  <path d="M8 14 L${w-8} 14 L${w-22} ${h-6} Q${w/2} ${h+4} 22 ${h-6} Z" fill="#fff" opacity=".22"/>
  <path d="M13 44 L${w-13} 44 L${w-24} ${h-10} Q${w/2} ${h-2} 24 ${h-10} Z" fill="#C97C3C"/>
  <path d="M13 44 L${w-13} 44 L${w-15} 66 L15 66 Z" fill="#E7B27A"/>
  <rect x="30" y="52" width="26" height="26" rx="6" fill="#fff" opacity=".7" transform="rotate(-12 43 65)"/>
  <rect x="62" y="70" width="24" height="24" rx="6" fill="#fff" opacity=".55" transform="rotate(15 74 82)"/>
  <rect x="38" y="96" width="22" height="22" rx="6" fill="#fff" opacity=".4" transform="rotate(8 49 107)"/>
  <rect x="14" y="20" width="10" height="${h*.6}" rx="5" fill="#fff" opacity=".35"/>`);
const cubeSVG=(s=44)=>svg(s,s,`<rect x="2" y="2" width="${s-4}" height="${s-4}" rx="${s*.22}" fill="#fff"/><rect x="${s*.18}" y="${s*.18}" width="${s*.3}" height="${s*.3}" rx="4" fill="#E9E3FF"/><rect x="${s*.56}" y="${s*.56}" width="${s*.22}" height="${s*.22}" rx="3" fill="#D8CFFA"/>`);
const rbcSVG=(s=90)=>svg(s,s*.72,`<ellipse cx="${s/2}" cy="${s*.36}" rx="${s/2}" ry="${s*.36}" fill="#F25C67"/><ellipse cx="${s/2}" cy="${s*.36}" rx="${s*.26}" ry="${s*.17}" fill="#D93D4E"/>`);
const keySVG=(s=70)=>svg(s,s*.5,`<circle cx="${s*.22}" cy="${s*.25}" r="${s*.2}" fill="none" stroke="#2ED3B7" stroke-width="${s*.1}"/><rect x="${s*.4}" y="${s*.19}" width="${s*.56}" height="${s*.12}" rx="4" fill="#2ED3B7"/><rect x="${s*.72}" y="${s*.25}" width="${s*.09}" height="${s*.18}" rx="2" fill="#2ED3B7"/><rect x="${s*.86}" y="${s*.25}" width="${s*.09}" height="${s*.14}" rx="2" fill="#2ED3B7"/>`);
const fatSVG=(s=70)=>svg(s,s,`<circle cx="${s/2}" cy="${s/2}" r="${s/2}" fill="#FFD166"/><circle cx="${s*.36}" cy="${s*.36}" r="${s*.14}" fill="#FFE9A8"/>`);
function faceSVG(o){ // 260x270 head
  const hair=o.hair||'#2b2340';
  return svg(260,270,`
  <circle cx="20" cy="158" r="22" fill="${o.skinD||SKIN_D}"/><circle cx="240" cy="158" r="22" fill="${o.skinD||SKIN_D}"/>
  <rect x="20" y="36" width="220" height="228" rx="106" fill="${o.skin||SKIN}"/>
  ${o.top||''}
  <g class="brow"><rect x="68" y="124" width="44" height="9" rx="4" fill="${o.brow||hair}"/><rect x="148" y="124" width="44" height="9" rx="4" fill="${o.brow||hair}"/></g>
  <g class="eyes" style="transform-origin:130px 158px"><circle cx="90" cy="158" r="10" fill="#1d1438"/><circle cx="170" cy="158" r="10" fill="#1d1438"/><circle cx="93" cy="155" r="3" fill="#fff"/><circle cx="173" cy="155" r="3" fill="#fff"/></g>
  <g class="lids" opacity="0"><rect x="74" y="146" width="32" height="14" fill="${o.skin||SKIN}"/><rect x="154" y="146" width="32" height="14" fill="${o.skin||SKIN}"/><path d="M76 160 Q90 168 104 160" stroke="#1d1438" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M156 160 Q170 168 184 160" stroke="#1d1438" stroke-width="5" fill="none" stroke-linecap="round"/></g>
  <circle cx="58" cy="192" r="18" fill="#F58BA0" opacity=".55"/><circle cx="202" cy="192" r="18" fill="#F58BA0" opacity=".55"/>
  ${o.extra||''}
  <g class="m-smile"><path d="M104 ${o.my||224} Q130 ${(o.my||224)+22} 156 ${o.my||224}" stroke="#1d1438" stroke-width="7" fill="none" stroke-linecap="round"/></g>
  <g class="m-open" opacity="0"><ellipse cx="130" cy="${(o.my||224)+6}" rx="17" ry="21" fill="#4a1630"/><ellipse cx="130" cy="${(o.my||224)+16}" rx="10" ry="8" fill="#F0688A"/></g>
  <g class="m-sad" opacity="0"><path d="M106 ${(o.my||224)+14} Q130 ${(o.my||224)-4} 154 ${(o.my||224)+14}" stroke="#1d1438" stroke-width="7" fill="none" stroke-linecap="round"/></g>`);
}
const armSVG=(sleeve,len=190)=>svg(70,len,`<rect x="8" y="0" width="54" height="${len-30}" rx="27" fill="${SKIN}"/><rect x="4" y="0" width="62" height="${len*.48}" rx="28" fill="${sleeve}"/><circle cx="35" cy="${len-30}" r="31" fill="${SKIN}"/>`);
/* character = box 460x620, feet/bottom centre origin */
function person(parent,id,x,y,kind,scale=1){
  const d=mk(parent,id,x,y,460,620,'','50% 100%');
  const k=kind==='doc'?{shirt:'#E2C48E',shirtD:'#CDAE78',hair:'#231a3a',
      top:`<path d="M24 120 Q14 30 130 26 Q250 26 236 120 Q200 70 120 76 Q60 80 24 120Z" fill="#231a3a"/>`,
      extra:`<circle cx="90" cy="158" r="30" fill="rgba(255,255,255,.12)" stroke="#231a3a" stroke-width="7"/><circle cx="170" cy="158" r="30" fill="rgba(255,255,255,.12)" stroke="#231a3a" stroke-width="7"/><rect x="118" y="154" width="24" height="7" fill="#231a3a"/>`}
    :{shirt:'#2BA39B',shirtD:'#238a84',hair:'#8f8aa6',brow:'#6f6a86',my:230,
      top:`<rect x="26" y="96" width="30" height="62" rx="12" fill="#B9B5CC"/><rect x="204" y="96" width="30" height="62" rx="12" fill="#B9B5CC"/><path d="M30 112 Q26 22 130 22 Q234 22 230 112 Z" fill="#1d1438"/><rect x="30" y="96" width="200" height="18" rx="6" fill="#33285c"/>`,
      extra:`<path d="M86 206 Q130 184 174 206 Q130 224 86 206Z" fill="#9c97b3"/>`};
  d.innerHTML=`
   <div class="a armB" style="left:330px;top:338px;width:70px;height:190px;transform-origin:50% 14%">${armSVG(k.shirtD)}</div>
   <div class="a body" style="left:0;top:0;width:460px;height:620px;transform-origin:50% 100%">${svg(460,620,`
     <rect x="198" y="296" width="64" height="70" fill="${SKIN_D}"/>
     <path d="M70 420 Q70 336 160 336 L300 336 Q390 336 390 420 L${kind==='doc'?396:412} 620 L${kind==='doc'?64:48} 620 Z" fill="${k.shirt}"/>
     ${kind==='doc'?`<path d="M186 336 L230 396 L274 336 Z" fill="${SKIN_D}"/><path d="M186 336 L230 396 L206 420 L160 344Z" fill="#F1DDB4"/><path d="M274 336 L230 396 L254 420 L300 344Z" fill="#F1DDB4"/>
        <path d="M170 350 Q150 470 200 520" stroke="#3a3560" stroke-width="9" fill="none"/><path d="M290 350 Q312 440 300 500" stroke="#3a3560" stroke-width="9" fill="none"/><circle cx="300" cy="512" r="20" fill="#cfd3e6" stroke="#3a3560" stroke-width="7"/>`
       :`<path d="M190 336 L230 384 L270 336 Z" fill="${SKIN_D}"/><path d="M190 336 L230 384 L212 404 L170 340Z" fill="#3fbdb4"/><path d="M270 336 L230 384 L248 404 L290 340Z" fill="#3fbdb4"/>
        <ellipse class="belly" cx="230" cy="540" rx="150" ry="96" fill="${k.shirtD}" opacity=".55"/><circle cx="230" cy="440" r="7" fill="#1c6f6a"/><circle cx="230" cy="492" r="7" fill="#1c6f6a"/><circle cx="230" cy="544" r="7" fill="#1c6f6a"/>`}`)}</div>
   <div class="a head" style="left:100px;top:52px;width:260px;height:270px;transform-origin:50% 96%">${faceSVG(k)}</div>
   <div class="a armF" style="left:62px;top:338px;width:70px;height:190px;transform-origin:50% 14%">${armSVG(k.shirt)}</div>`;
  d._s=scale;return d;
}
function mouth(el,m){['smile','open','sad'].forEach(n=>{const g=el.querySelector('.m-'+n);if(g)g.setAttribute('opacity',n===m?1:0)})}
function animPerson(el,t,o={}){ // idle + blink
  const ph=o.ph||0, s=el._s;
  el.querySelector('.body').style.transform=`rotate(${(sin(t*3.7+ph)*1.1).toFixed(2)}deg)`;
  T(el.querySelector('.head'),{r:sin(t*2.7+ph)*1.8+(o.headR||0),y:(o.headY||0)});
  const b=((t+ph*1.3)%3.5), closed=(b>3.3)||o.sleepy;
  el.querySelector('.eyes').setAttribute('opacity',closed?0:1); el.querySelector('.lids').setAttribute('opacity',closed?1:0);
  mouth(el,o.mouth||'smile');
  T(el.querySelector('.armF'),{r:(o.armF??6)+sin(t*3.3+ph)*1.5});
  T(el.querySelector('.armB'),{r:(o.armB??-6)+sin(t*3.3+ph+1)*1.5});
  T(el,{s:s*(o.s??1),x:o.x||0,y:o.y||0,r:o.r||0,o:o.o??1});
}

/* ---------- ambient background ---------- */
const amb=$('amb'), blobs=[], stars=[];
for(let i=0;i<7;i++){const s=180+rnd(i)*260;const b=mk(amb,'',rnd(i+9)*1080-s/2,rnd(i+20)*1920-s/2,s,s,'');b.className='a blob';
  b.style.background=['#7b4bd6','#c0428f','#4a56d8','#9a3fb0'][i%4];b.style.opacity=.28;blobs.push(b)}
for(let i=0;i<46;i++){const s=3+rnd(i+50)*6;const b=mk(amb,'',rnd(i+70)*1080,rnd(i+90)*1920,s,s,'');b.className='a star';stars.push(b)}

/* ---------- scenes ---------- */
const SC={};
function scene(id,a,b){const d=mk('scenes',id,0,0,1080,1920,'');d.className='a sc';const c=mk(d,id+'c',0,0,1080,1920,'');c.className='a cam';SC[id]={el:d,cam:c,a,b};return c;}
const TOTAL=60.6;
/* S1 kedai 0–6.55 */
let c=scene('s1',0,6.55);
mk(c,'s1lamp',760,430,200,260,svg(200,260,`<rect x="96" y="0" width="8" height="120" fill="#150f40"/><path d="M40 190 Q40 110 100 110 Q160 110 160 190Z" fill="#FFC93C"/><ellipse cx="100" cy="196" rx="40" ry="14" fill="#fff2b8"/><circle cx="100" cy="210" r="110" fill="#FFC93C" opacity=".12"/>`),'50% 0');
mk(c,'s1wall',0,1420,1080,640,svg(1080,640,`<rect width="1080" height="640" fill="#1b1150"/>`));
const pd1=person(c,'pd1',310,850,'pak',1.32);
mk(c,'s1table',70,1420,940,120,svg(940,120,`<rect width="940" height="120" rx="40" fill="#E94F8B"/><rect y="70" width="940" height="50" rx="25" fill="#C93A75"/>`));
mk(c,'g1',130,1240,120,190,glassSVG(),'50% 100%');mk(c,'g2',290,1240,120,190,glassSVG(),'50% 100%');
mk(pd1.querySelector('.armB'),'g3',-25,95,120,190,glassSVG(),'50% 60%');
mk(c,'title',90,372,900,0,`<div class="box"><div class="s">APA JADI DALAM BADAN SELEPAS</div><div class="b">TEH AIS<br>MANIS?</div></div><div class="p">3 gelas sehari · 10 tahun</div>`,'50% 40%');$('title').style.height='auto';
chip(c,'c1a',70,420,'3 gelas sehari','yel','🥤');chip(c,'c1b',600,520,'10 tahun','pink','📅');
mk(c,'xray',380,1130,320,320,svg(320,320,`<circle cx="160" cy="160" r="150" fill="#7a1740" stroke="#fff" stroke-width="10"/><ellipse cx="110" cy="130" rx="46" ry="32" fill="#F25C67"/><ellipse cx="210" cy="190" rx="46" ry="32" fill="#F25C67"/><rect x="180" y="96" width="34" height="34" rx="8" fill="#fff"/><rect x="96" y="196" width="30" height="30" rx="8" fill="#fff"/>`));
/* S2 darah 6.55–11.86 */
c=scene('s2',6.55,11.86);
mk(c,'tube',-60,640,1200,640,svg(1200,640,`<rect y="0" width="1200" height="640" rx="60" fill="#8f1b3c"/><rect y="46" width="1200" height="548" fill="#c22d4b"/><rect y="46" width="1200" height="40" fill="#a62344"/><rect y="554" width="1200" height="40" fill="#a62344"/>`));
const flow=mk(c,'flow',0,686,1080,548,'');flow.style.overflow='hidden';
const rbc=[],cubes2=[];
for(let i=0;i<11;i++)rbc.push(mk(flow,'',0,0,96,70,rbcSVG(96)));
for(let i=0;i<22;i++)cubes2.push(mk(flow,'',0,0,50,50,cubeSVG(50)));
chip(c,'c2a',70,440,'10 minit kemudian','', '⏱️');
mk(c,'meter',110,1350,860,170,`<div class="card" style="width:860px;height:170px;padding:22px 30px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:36px"><span>Paras gula darah</span><span id="mtxt" style="color:var(--teal)">NORMAL</span></div><div style="margin-top:20px;height:44px;border-radius:22px;background:#2c2378;overflow:hidden"><div id="mbar" style="height:44px;border-radius:22px;width:30%;background:var(--teal)"></div></div></div>`);
mk(c,'up',860,1180,150,150,svg(150,150,`<circle cx="75" cy="75" r="72" fill="#F0468A"/><path d="M75 30 L118 80 L92 80 L92 120 L58 120 L58 80 L32 80Z" fill="#fff"/>`));
/* S3 pankreas 11.86–17.55 */
c=scene('s3',11.86,17.55);
const pancSVG=(col,colD)=>svg(420,260,`<path d="M30 150 Q10 60 110 50 Q200 44 270 90 Q340 130 400 110 Q420 150 380 190 Q300 240 200 210 Q110 240 60 210 Q30 190 30 150Z" fill="${col}"/><circle cx="110" cy="110" r="16" fill="${colD}"/><circle cx="220" cy="170" r="14" fill="${colD}"/><circle cx="320" cy="170" r="12" fill="${colD}"/>`);
const pancFace=(tired)=>svg(420,260,tired?`<path d="M96 132 Q112 142 128 132" stroke="#1d1438" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M176 132 Q192 142 208 132" stroke="#1d1438" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M132 186 Q152 172 172 186" stroke="#1d1438" stroke-width="7" fill="none" stroke-linecap="round"/>`
  :`<circle cx="112" cy="132" r="11" fill="#1d1438"/><circle cx="192" cy="132" r="11" fill="#1d1438"/><ellipse cx="152" cy="176" rx="15" ry="12" fill="#4a1630"/><circle cx="84" cy="160" r="14" fill="#F58BA0" opacity=".6"/><circle cx="222" cy="160" r="14" fill="#F58BA0" opacity=".6"/>`);
const p3=mk(c,'panc',120,720,420,260,pancSVG('#FFB26B','#F09248')+`<div class="a" style="left:0;top:0">${pancFace(false)}</div>`,'50% 60%');
const sweat3=[0,1,2].map(i=>mk(c,'',0,0,26,36,svg(26,36,`<path d="M13 0 Q26 20 13 34 Q0 20 13 0Z" fill="#8fd8ff"/>`)));
const cellSVG=svg(420,420,`<circle cx="210" cy="210" r="200" fill="#F7A8C4"/><circle cx="210" cy="210" r="170" fill="#F9BDD3"/><circle cx="250" cy="200" r="62" fill="#E776A2"/><circle cx="262" cy="190" r="22" fill="#D45A8C"/>`);

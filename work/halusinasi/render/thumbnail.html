<!doctype html><html lang="ms"><head><meta charset="utf-8"><title>Thumbnail – Jenis-jenis Halusinasi</title>
<style>
@font-face{font-family:M;src:url(fonts/Montserrat-800.ttf);font-weight:800}
@font-face{font-family:M;src:url(fonts/Montserrat-900.ttf);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#052751;font-family:M,sans-serif;color:#fff}
.bg{position:absolute;left:0;top:250px;width:1080px;height:1930px;background:url(thumb_bg.png) center top/1080px 1930px no-repeat;filter:contrast(1.08) saturate(1.12)}
.shadeT{position:absolute;left:0;top:0;width:100%;height:700px;background:linear-gradient(180deg,#052751 0%,#052751 36%,rgba(5,39,81,.75) 62%,rgba(5,39,81,0) 100%)}
.shadeB{position:absolute;left:0;bottom:0;width:100%;height:560px;background:linear-gradient(0deg,rgba(5,39,81,.98) 0%,rgba(5,39,81,.75) 50%,rgba(5,39,81,0) 100%)}
.head{position:absolute;left:40px;right:40px;top:250px;text-align:center}
.head .a{font-weight:900;font-size:104px;line-height:1.0;letter-spacing:-1px;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.head .b{font-weight:900;font-size:150px;line-height:.98;color:#FAE24E;letter-spacing:-3px;text-shadow:0 10px 36px rgba(0,0,0,.6)}
.foot{position:absolute;left:60px;right:60px;top:1430px;text-align:center}
.pill{display:inline-block;background:#4CDFDA;color:#052751;font-weight:900;font-size:50px;padding:22px 44px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45);border-radius:60px;letter-spacing:1px}
.badge{position:absolute;left:50%;transform:translateX(-50%);top:1560px;width:124px;height:124px;border-radius:32px;overflow:hidden;border:4px solid #4CDFDA;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.badge img{width:100%;height:100%;object-fit:cover}
</style></head><body>
<div class="bg"></div><div class="shadeT"></div><div class="shadeB"></div>
<div class="head"><div class="a">JENIS-JENIS</div><div class="b">HALUSINASI</div></div>
<div class="foot"><div class="pill">NAMPAK BENDA YANG TIADA?</div></div>
<div class="badge"><img src="logo_crop.png" alt="Klinik Nissa"></div>
</body></html>

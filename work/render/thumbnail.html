<!doctype html><html lang="ms"><head><meta charset="utf-8"><title>Thumbnail – Tiada Emosi</title>
<style>
@font-face{font-family:M;src:url(fonts/Montserrat-800.ttf);font-weight:800}
@font-face{font-family:M;src:url(fonts/Montserrat-900.ttf);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#052751;font-family:M,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:url(thumb_bg.png) center 46%/cover no-repeat;filter:contrast(1.08) saturate(1.1)}
.shadeT{position:absolute;left:0;top:0;width:100%;height:760px;background:linear-gradient(180deg,rgba(5,39,81,.97) 0%,rgba(5,39,81,.85) 55%,rgba(5,39,81,0) 100%)}
.shadeB{position:absolute;left:0;bottom:0;width:100%;height:700px;background:linear-gradient(0deg,rgba(5,39,81,.98) 0%,rgba(5,39,81,.8) 50%,rgba(5,39,81,0) 100%)}
.head{position:absolute;left:60px;right:60px;top:300px;text-align:center}
.head .a{font-weight:900;font-size:104px;line-height:1.0;letter-spacing:-1px;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.head .b{font-weight:900;font-size:168px;line-height:.98;color:#FAE24E;letter-spacing:-2px;text-shadow:0 10px 36px rgba(0,0,0,.6)}
.foot{position:absolute;left:60px;right:60px;top:1320px;text-align:center}
.pill{display:inline-block;background:#4CDFDA;color:#052751;font-weight:900;font-size:46px;padding:18px 40px;border-radius:60px;letter-spacing:1px}
.sub{margin-top:26px;font-weight:800;font-size:40px;line-height:1.25;color:#e6eef8}
.badge{position:absolute;left:50%;transform:translateX(-50%);top:1530px;width:150px;height:150px;border-radius:34px;overflow:hidden;border:4px solid #4CDFDA;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.badge img{width:100%;height:100%;object-fit:cover}
</style></head><body>
<div class="bg"></div><div class="shadeT"></div><div class="shadeB"></div>
<div class="head"><div class="a">KALAU MANUSIA</div><div class="b">TIADA EMOSI?</div></div>
<div class="foot"><div class="pill">5 KESAN BESAR</div><div class="sub">Diri · Hubungan · Kerja · Negara · Dunia</div></div>
<div class="badge"><img src="logo_crop.png" alt="Klinik Nissa"></div>
</body></html>
